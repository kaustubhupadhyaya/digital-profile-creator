[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-profile-creator"
version = "0.1.0"
description = "Local, no-network pipeline for an evidence-grounded digital profile"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "digital-profile-creator contributors" }]
keywords = ["digital-profile", "persona", "sqlite", "fts5", "privacy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
dependencies = []

[project.scripts]
twin = "twin:main"

[tool.setuptools]
py-modules = ["twin"]
